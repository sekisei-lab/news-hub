<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>News Hub</h1>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="list" class="grid"></div>
</main>
<button id="refresh" class="fab" type="button" aria-label="最新に更新してトップへ戻る"><span class="ico">↻</span><span class="lbl"><span>更新</span><small id="status">--:--</small></span></button>

<div id="reader" class="reader" hidden role="dialog" aria-modal="true" aria-label="記事の詳細">
  <article class="rcard">
    <img id="rImg" class="rimg" alt="" referrerpolicy="no-referrer" hidden>
    <div class="rmeta" id="rMeta"></div>
    <h2 id="rTitle"></h2>
    <div id="rText" class="rtext"></div>
    <p id="rNote" class="rnote"></p>
    <div class="rbar bottom">
      <button id="rBack2" type="button" class="rbtn">← 戻る</button>
      <a id="rOrig2" class="rbtn primary" target="_blank" rel="noopener noreferrer">原文を読む ↗</a>
    </div>
  </article>
</div>

<dialog id="settings">
  <div class="dlg">
    <div class="main">
      <h3>ジャンル設定</h3>
      <p class="note">チェックで表示/非表示、左の ⠿ をドラッグして並び替え。設定はこのブラウザにだけ保存され、他の人には影響しません。</p>
      <ul id="tabList"></ul>
      <form id="addForm">
        <input id="kwInput" placeholder="キーワードタブを追加（例: 半導体 TSMC）" required>
        <button type="submit">追加</button>
      </form>
    </div>
    <div class="side">
      <button id="closeBtn" type="button">確定</button>
      <button id="cancelBtn" type="button" class="ghost">キャンセル</button>
      <button id="resetBtn" type="button" class="ghost">初期化</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
