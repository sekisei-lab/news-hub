<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Hub</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Hub">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>News Hub</h1>
    <div class="langs" id="langs" aria-label="翻訳"><span id="langst" class="langst"></span><button type="button">原</button></div>
  </div>
  <nav id="tabs"></nav>
  <div id="markets" class="markets" hidden></div>
  <div id="hot" class="hotbar" hidden></div>
  <div id="newcar" class="hotbar" hidden></div>
  <div id="insider" class="hotbar insider" hidden></div>
</header>
<main>
  <section id="suvpanel" class="suvpanel" hidden></section>
  <div id="list" class="grid"></div>
</main>
<div id="flow" class="flow" hidden><canvas id="flowcv"></canvas><div id="flowsp"></div><div id="flowfade2" class="flowfade2"></div><button type="button" class="ffull" id="ffull" aria-label="全画面" title="全画面" hidden><svg class="i-enter" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="i-exit" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button><button type="button" class="fclose"><span class="fst">✦</span><span>戻る</span></button></div>
<div id="flowfade" class="flowfade"></div>
<div id="suvview" class="suvview" hidden role="dialog" aria-modal="true" aria-label="車種の画像と相場"></div>
<button id="refresh" class="fab" type="button" aria-label="最新に更新してトップへ戻る"><span class="ico">↻</span><span class="lbl"><span>更新</span><small id="status">--:--</small></span></button>

<div id="reader" class="reader" hidden role="dialog" aria-modal="true" aria-label="記事の詳細">
  <article class="rcard">
    <img id="rImg" class="rimg" alt="" referrerpolicy="no-referrer" hidden>
    <div id="rGal" class="rgal" hidden></div>
    <div class="rmeta" id="rMeta"></div>
    <h2 id="rTitle"></h2>
    <div id="rText" class="rtext"></div>
    <p id="rNote" class="rnote"></p>
    <div class="rbar bottom">
      <button id="rBack2" type="button" class="rbtn">← 戻る</button>
      <a id="rOrig2" class="rbtn primary" target="_blank" rel="noopener noreferrer">原文を読む ↗</a>
    </div>
  </article>
</div>

<dialog id="settings">
  <div class="dlg">
    <div class="dh">
      <h3>ジャンル設定</h3>
      <p class="note">色のついたジャンルが表示中です。クリックで表示/非表示、ドラッグで並び替えできます。設定はこのブラウザだけに保存されます。</p>
    </div>
    <div class="db">
      <ul id="tabList"></ul>
      <form id="addForm">
        <label for="kwInput" class="fl">キーワードでタブを作る</label>
        <div class="row">
          <input id="kwInput" placeholder="例: 半導体 TSMC（スペース区切りで複数可）" required>
          <button type="submit" class="sec">検索</button>
        </div>
      </form>
    </div>
    <div class="df">
      <button id="resetBtn" type="button" class="link">初期化</button>
      <span class="sp"></span>
      <button id="cancelBtn" type="button" class="ghost">キャンセル</button>
      <button id="closeBtn" type="button" class="pri">確定</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="translate.js"></script>
</body>
</html>
