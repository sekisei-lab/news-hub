<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>News Hub</h1>
    <span id="status" class="status">読み込み中…</span>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="list" class="grid"></div>
</main>
<button id="refresh" class="fab" type="button" aria-label="最新に更新してトップへ戻る"><span class="ico">↻</span><span>更新</span></button>

<dialog id="settings">
  <h3>ジャンル設定</h3>
  <p class="note">チェックで表示/非表示、左の ⠿ をドラッグして並び替え。この設定はお使いのブラウザにだけ保存され、他の人には影響しません。</p>
  <ul id="tabList"></ul>
  <form id="addForm">
    <h4>キーワードタブを追加</h4>
    <input id="kwInput" placeholder="キーワード（スペース区切りでOR）例: 半導体 TSMC" required>
    <input id="labelInput" placeholder="タブ名（省略可）">
    <button type="submit">追加</button>
  </form>
  <div class="foot">
    <button id="resetBtn" type="button" class="ghost">初期化</button>
    <button id="closeBtn" type="button">確定</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
